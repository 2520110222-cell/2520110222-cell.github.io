### Skills [ skills ]
skills:
  title: "보유 기술"
  subtitle: "보안관제/침해대응 <b>역량</b>"
  bg_title: "Skills"

  column1:
    items:
      - label: "네트워크 보안" #0-10 progress in dots
        text: "iptables 로 External/Intra/DMZ 3-zone 토플로지를 직접 구성하고, ICMP,DNS,HTTP,HTTPS 정책과 SSH 접근통제, SYN flood차단까지 설계한 경험이 있습니다."
        value: "80" #0-100 progress in %

      - label: "IDS/IPS (Snort)" #0-10 progress in dots
        text: "IDS/IPS Snort룰을 직접 작성해 ICMP 탐지와 TLS 핸드셰이크 기반 침입 탐지 환경을 구축하고, thershold 설정으로 오탐을 줄이는 실습을 진행했습니다."
        value: "75" #0-100 progress in %

  column2:
    items:
      - label: "침해대응/로그분석" #0-10 progress in dots
        text: "iptables LOG로 남긴 트래픽 로그를 분석해 SRC/DST 포트,프로토콜 단위로 정상, 비정상 통신을 구분하고 이상 징후를 판단하는 방법을 학습하고 있습니다."
        value: "70" #0-100 progress in %

      - label: "Linux/서버보안 " #0-10 progress in dots
        text: "ubuntu, kali 환경에서 방화벽과 NAT를 직접 구성하고, OPNssense 방화벽 VM과 vsftpd FTP 서버를 구축하며 서버 보안 설정을 익혔습니다."
        value: "75" #0-100 progress in %

  column3:
    items:
      - label: "Python" #0-10 progress in dots
        text: "FastAPI로 보안 진단 백엔드를 개발하고, 소켓 프로그래밍으로 멀티스레드 IP 스캐닝,파일전송을 구현하며 보안 분석 자동화에 활용합니다."
        value: "75" #0-100 progress in %

      - label: "보안 프로젝트 (PURE QR)" #0-10 progress in dots
        text: "악성 URL,QR 탐지 앱의 백엔드와 Android 클라리언트를 개발하고, VirusTotal, Google Safe Browsing, WHOIS, SSl 검증 등 외부 보안 API를 연동했습니다."
        value: "70" #0-100 progress in %

### Resume [ resume ]
resume:
  title: "학력"
  subtitle: "나의 <b>Story</b>"
  bg_title: "History"

  education:
    title: "Education"
    items:
      - name: "한국폴리텍대학교"
        subname: "사이버보안과"
        period: "2025 - 2027"
        text: "네트워크 보안, 방화벽 구성, 프로그래밍언어 등등 다양한 실습을 중심으로 학습 중입니다."

      - name: "다산고등학교"
        subname: "의료정보학과"
        period: "2018 - 2021"
        text: "컴퓨터활용, AutoCAD, 그래픽제작, Adobe Photoshop 등 다양한 분야의 실습을 중심으로 학습했습니다."


  experience:
    title: "경력 및 활동"
    items:
      - name: "PURE QR 프로젝트"
        subname: "자동탐지 보안시스템 앱 개발"
        period: "2026 - <b>현재</b>"
        text: "악성 QR,URL 탐지 앱의 백엔드와 외부 보안 API 연동을 개발했습니다."


