# Navigation configuration file
##
### to add or remove menu item
### param "title" - Menu item name
### param "url" - Menu item url
### param "parent" - set "1" for enable submenu and "childs" param

main:
  # Home
  - title: "홈"
    url: "/"
    parent: 0

  # Services
  - title: "서비스"
    url: "#services-section"
    parent: 0

  # Skills
  - title: "포트폴리오"
    url: "#portfolio-section"
    parent: 0

  # Works
  - title: "이력서"
    url: "#resume-section"
    parent: 0

  # Resume
  - title: "블로그"
    url: "blog/"
    parent: 0

  # Testimonials
  - title: "연락하기"
    url: "#contacts-section"
    parent: 0

  # Additional Pages
  - title: "더보기"
    url: ""
    parent: 1
    childs:
        - title: "포트폴리오 전체"
          url: "works/"

        - title: "블로그"
          url: "blog/"
